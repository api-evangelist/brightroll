name: BrightRoll
description: >-
  BrightRoll was a programmatic video advertising platform founded in 2006 in San Francisco that ran
  one of the largest independent real-time bidding marketplaces for digital video ads (RTB/DSP/SSP),
  connecting brand advertisers and agencies with publisher video inventory across web, mobile, and
  connected devices. The company was acquired by Yahoo in November 2014 and its technology was folded
  into Yahoo's advertising stack, later branded under Oath / Verizon Media and now Yahoo Advertising.
  BrightRoll no longer operates as an independent provider and publishes no standalone developer
  program or public API. As of this enrichment pass its former domain, brightroll.com, returns an
  HTTP 301 redirect to Yahoo's advertising platforms page, and the domain is served from Yahoo-owned
  DNS and mail infrastructure. This profile is retained in the API Evangelist network as an acquired /
  absorbed company record rather than an active API producer.
